name: Update Tailscale

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Sync Dockerfile from upstream
        id: sync
        run: |
          git remote add upstream https://github.com/hassio-addons/addon-tailscale.git || true
          git fetch upstream
          git show upstream/main:tailscale/Dockerfile > /tmp/upstream-dockerfile
          
          if ! diff -q tailscale/Dockerfile /tmp/upstream-dockerfile > /dev/null 2>&1; then
            cp /tmp/upstream-dockerfile tailscale/Dockerfile
            echo "dockerfile_changed=true" >> $GITHUB_OUTPUT
          else
            echo "dockerfile_changed=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Remove package version pins
        run: |
          sed -i 's/=.*-r[0-9]//g' tailscale/Dockerfile
          
      - name: Get latest Tailscale version
        id: tailscale
        run: |
          LATEST=$(curl -s https://api.github.com/repos/tailscale/tailscale/releases/latest | jq -r .tag_name | sed 's/v//')
          CURRENT=$(grep 'ARG TAILSCALE_VERSION=' tailscale/Dockerfile | cut -d'"' -f2 | sed 's/v//')
          echo "latest=$LATEST" >> $GITHUB_OUTPUT
          echo "current=$CURRENT" >> $GITHUB_OUTPUT
          
      - name: Verify binary exists
        id: verify
        run: |
          VERSION="${{ steps.tailscale.outputs.latest }}"
          
          # Check if amd64 binary exists (most common architecture)
          if curl --head --silent --fail "https://pkgs.tailscale.com/stable/tailscale_${VERSION}_amd64.tgz" > /dev/null 2>&1; then
            echo "binary_exists=true" >> $GITHUB_OUTPUT
            echo "Tailscale ${VERSION} binaries available"
          else
            echo "binary_exists=false" >> $GITHUB_OUTPUT
            echo "Tailscale ${VERSION} binaries not yet published, staying on ${{ steps.tailscale.outputs.current }}"
          fi
          
      - name: Check if Tailscale update needed
        id: check
        run: |
          if [ "${{ steps.tailscale.outputs.latest }}" != "${{ steps.tailscale.outputs.current }}" ] && [ "${{ steps.verify.outputs.binary_exists }}" == "true" ]; then
            echo "tailscale_update=true" >> $GITHUB_OUTPUT
          else
            echo "tailscale_update=false" >> $GITHUB_OUTPUT
          fi
          
      - name: Update Tailscale version
        if: steps.check.outputs.tailscale_update == 'true'
        run: |
          sed -i "s/ARG TAILSCALE_VERSION=\".*\"/ARG TAILSCALE_VERSION=\"${{ steps.tailscale.outputs.latest }}\"/" tailscale/Dockerfile
          
      - name: Check if anything changed
        id: changes
        run: |
          if git diff --quiet tailscale/Dockerfile tailscale/config.yaml; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
          
      - name: Bump addon version
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          CURRENT_VERSION=$(grep '^version:' tailscale/config.yaml | awk '{print $2}')
          NEW_VERSION=$(echo $CURRENT_VERSION | awk -F. '{$NF = $NF + 1;} 1' | sed 's/ /./g')
          sed -i "s/version: $CURRENT_VERSION/version: $NEW_VERSION/" tailscale/config.yaml
          echo "Version bumped from $CURRENT_VERSION to $NEW_VERSION"
          
      - name: Commit and push
        if: steps.changes.outputs.has_changes == 'true'
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add tailscale/Dockerfile tailscale/config.yaml
          
          if [ "${{ steps.check.outputs.tailscale_update }}" == "true" ] && [ "${{ steps.sync.outputs.dockerfile_changed }}" == "true" ]; then
            COMMIT_MSG="Update Tailscale to ${{ steps.tailscale.outputs.latest }} and sync Dockerfile from upstream"
          elif [ "${{ steps.check.outputs.tailscale_update }}" == "true" ]; then
            COMMIT_MSG="Update Tailscale to ${{ steps.tailscale.outputs.latest }}"
          else
            COMMIT_MSG="Sync Dockerfile from upstream"
          fi
          
          git commit -m "$COMMIT_MSG"
          git push
